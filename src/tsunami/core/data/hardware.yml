# Hardware catalog: switch families offered in the day-0 "model" dropdown.
# Spec: design.md, Inventory and variables: Hardware catalog.
#
# Keys: id, vendor, label (dropdown text), platform, netmiko_device_type, console_baud,
# lifecycle, eos_year, model_pattern (regex searched in the model string from fact
# gathering), examples (representative SKUs).
#
# Verification (details and sources: docs/research/hardware-catalog.md, checked 2026-10-10):
# - Verified against vendor sources: Netmiko device types, AOS-CX console baud, Cisco
#   lifecycle and eos_year (Cisco EoS/EoL bulletins), Cisco platform (IOS vs IOS-XE) for
#   most families, Aruba 2530/2540/3810M/8360 end-of-sale notices.
# - eos_year is the year the newest member of the family reached end of sale.
# - NOT verified against a device or vendor source: every model_pattern (checked only
#   against the documented formats in docs/research/aruba-cli.md and Cisco show version
#   samples), most Aruba examples, Aruba lifecycle for 6000, 8320/8400, 2920, 3800,
#   legacy ProCurve (third-party trackers only or nothing), and AOS-S console baud.
#   See the research doc for the per-field table.
#
# AOS-S entries use hp_procurve; aruba_procurve and aruba_osswitch are aliases for the
# same Netmiko class. Every platform in this file has a driver in v1.

