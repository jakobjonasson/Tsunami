name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # One command per step: a multi-line pwsh step only fails on its last command.
      - name: Install
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Tests
        run: uv run pytest

      - name: Self-test
        run: uv run python -m tsunami --selftest
